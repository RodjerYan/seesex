# xTracker — Render Blueprint
# Деплой: GitHub -> Render (auto-deploy on push to main).
# Тариф free — карта не требуется; persistent disk на free недоступен,
# поэтому SQLite-файл БД живёт в Google Drive пользователя и синхронизируется
# приложением (boot.ts скачивает файл, drive-sync.ts заливает снапшоты).
# Секреты (JWT_SECRET, ENCRYPTION_KEY) Render сгенерирует сам (generateValue).
# Google OAuth (GOOGLE_*) — значения задаются вручную в Render Dashboard
# -> Environment (env ниже помечен sync: false).
services:
  - type: web
    name: xtracker-web
    runtime: node
    plan: free
    buildCommand: cd apps/api && npm install --include=dev && DATABASE_URL="file:./build.db" npx prisma generate && npm run build && cd ../web && npm install --include=dev && npm run build && cp -r ./dist ../api/public
    startCommand: cd apps/api && node dist/boot.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: FRONTEND_URL
        value: https://xtracker-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://xtracker-web.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: '900000'
      - key: RATE_LIMIT_MAX
        value: '1000'
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: '900000'
      - key: AUTH_RATE_LIMIT_MAX
        value: '30'
      - key: PORT
        value: '10000'
      # Пусто = фронт ходит в API по относительным путям /api (тот же origin на Render).
      - key: VITE_API_URL
        value: ''
