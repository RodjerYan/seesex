# xTracker — Render Blueprint
# Деплой: GitHub -> Render (auto-deploy on push to main).
# Тариф free — карта не требуется; persistent disk на free недоступен.
# Секреты (JWT_SECRET, ENCRYPTION_KEY) Render сгенерирует сам (generateValue).
# DATABASE_URL — внешняя БД Neon (https://neon.tech): значение подставляется вручную
# в Render Dashboard -> Environment (env ниже помечен sync: false).
services:
  - type: web
    name: xtracker-web
    runtime: node
    plan: free
    buildCommand: cd apps/api && npm install --include=dev && npx prisma generate && npm run build && DATABASE_URL="$(echo "$DATABASE_URL" | sed 's/-pooler//')" npx prisma migrate deploy && npx prisma db seed && cd ../web && npm install --include=dev && npm run build && cp -r ./dist ../api/public
    startCommand: cd apps/api && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://xtracker-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://xtracker-web.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: '60000'
      - key: RATE_LIMIT_MAX
        value: '100'
      - key: PORT
        value: '10000'
      # Пусто = фронт ходит в API по относительным путям /api (тот же origin на Render).
      - key: VITE_API_URL
        value: ''
