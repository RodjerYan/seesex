# xTracker — Render Blueprint
# Деплой: GitHub -> Render (auto-deploy on push to main).
# Секреты (JWT_SECRET, ENCRYPTION_KEY) Render сгенерирует сам (generateValue).
# DATABASE_URL подтянется из базы xtracker-db (fromDatabase).
services:
  - type: web
    name: xtracker-web
    runtime: node
    plan: starter
    buildCommand: cd apps/api && npm install && npm run build && cd ../web && npm install && npm run build && cp -r ../web/dist ./public
    startCommand: cd apps/api && npm start
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /opt/render/app/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xtracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://xtracker-web.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://xtracker-web.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: '60000'
      - key: RATE_LIMIT_MAX
        value: '100'
      - key: UPLOAD_DIR
        value: /opt/render/app/uploads
      - key: MAX_FILE_SIZE
        value: '5242880'
      - key: MAX_PHOTOS_PER_PARTNER
        value: '3'
      - key: PORT
        value: '10000'

databases:
  - name: xtracker-db
    plan: starter
    databaseName: xtracker
    user: xtracker
