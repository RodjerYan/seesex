name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          set +e
          for i in 1 2 3; do
            echo "Attempt $i/3"
            curl --max-time 30 -s https://xtracker-web.onrender.com/health
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "Success on attempt $i"
              break
            else
              echo "Attempt $i failed with exit code $rc"
              if [ $i -lt 3 ]; then
                echo "Waiting 20 seconds before next attempt..."
                sleep 20
              fi
            fi
          done